{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}员工管理系统{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'employees/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="主导航">
      <a class="brand" href="{% url 'home' %}">员工管理系统</a>
      {% if user.is_authenticated %}
        <div class="account">
          <span>{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="link-button" type="submit">退出</button>
          </form>
        </div>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% if messages %}
      <ul class="messages" aria-label="操作结果">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

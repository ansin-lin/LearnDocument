{% extends "base.html" %}
{% block title %}登录 | 员工管理系统{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>登录</h1>
    {% if form.errors %}<p class="error">用户名或密码不正确。</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">登录</button>
    </form>
  </section>
{% endblock %}

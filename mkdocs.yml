site_name: LearnDocument 技术课程
site_url: https://ansin-lin.github.io/LearnDocument/
use_directory_urls: false
exclude_docs: |
  python/_archive/
  python/python-course-roadmap.md
theme:
  name: material
  language: zh
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - content.code.copy
  palette:
    primary: indigo
    accent: deep purple
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.magiclink
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.snippets
- pymdownx.tabbed
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
